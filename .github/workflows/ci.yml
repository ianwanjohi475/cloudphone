name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e "./orchestrator[dev]"
      - name: Lint
        run: |
          cd orchestrator
          ruff check .
          ruff format --check .
      - name: Test
        run: |
          cd orchestrator
          python -m pytest -q

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -S warning scripts/*.sh docker/ws-scrcpy/entrypoint.sh

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose
        run: |
          cp .env.example .env
          docker compose config -q
          echo "compose valid"

  images:
    runs-on: ubuntu-latest
    needs: [python, compose]
    steps:
      - uses: actions/checkout@v4
      - name: Build dashboard image
        run: docker build -f docker/dashboard/Dockerfile -t cloudphone/dashboard:ci .
      # ws-scrcpy build clones an upstream repo + npm; build it on demand to keep
      # CI fast and hermetic. Uncomment to verify locally / in nightly.
      # - name: Build ws-scrcpy image
      #   run: docker build -t cloudphone/ws-scrcpy:ci docker/ws-scrcpy
