name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: sudo apt-get update && sudo apt-get install -y python3-aiohttp shellcheck
      - name: Shell checks
        run: bash -n cloudphone && shellcheck -S warning cloudphone
      - name: Unit tests
        run: python3 -m unittest discover tests
      - name: Page script parses
        run: node --check server/static/app.js
