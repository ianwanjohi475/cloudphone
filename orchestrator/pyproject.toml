[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudphone"
version = "0.1.0"
description = "Self-hosted cloud-phone farm built on Redroid + ws-scrcpy"
readme = "../README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "docker>=7.0",
    "typer>=0.12",
    "rich>=13.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "pyflakes>=3.0"]

[project.scripts]
cloudphone = "cloudphone.cli:app"

[tool.setuptools.packages.find]
include = ["cloudphone*"]

[tool.setuptools.package-data]
cloudphone = ["web/templates/*.html", "web/static/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
